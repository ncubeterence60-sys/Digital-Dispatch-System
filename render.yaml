# Render Deployment Configuration - Render Ready
services:
  - type: web
    name: digital-dispatch-marketplace
    runtime: node
    buildCommand: |
      npm ci
      npm install better-sqlite3 --build-from-source --platform=linux --arch=x64
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromDatabase:
          name: dispatch-db
          property: port
      - key: DATABASE_URL
        fromDatabase:
          name: dispatch-db
          property: connectionString
