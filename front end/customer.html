<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer App - Digital Dispatch</title>
  <!-- PWA -->
  <link rel="manifest" href="manifest-customer.json">
  <!-- Core -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/uber-style.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
    .glass-card { background: rgba(255,255,255,0.25); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); }
    .tracking-card { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }
    .status-progress { height: 8px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="container-fluid p-4 pb-5">
    <!-- Header -->
    <header class="glass-card rounded-4 p-4 mb-4 shadow-lg">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <div class="h4 mb-1 fw-bold text-white">Digital Dispatch</div>
          <div class="text-white-50">Your ride is on the way</div>
        </div>
        <div class="text-center">
          <div class="status-dot bg-success mb-1" style="width:16px;height:16px;"></div>
          <div class="text-white small">Live tracking</div>
        </div>
      </div>
    </header>

    <!-- Trip Status -->
    <div class="tracking-card rounded-4 p-5 mb-4 text-center shadow-2xl">
      <div class="mb-4">
        <i class="fas fa-car fa-4x mb-3 opacity-75"></i>
        <h2 class="mb-1">Driver Arriving</h2>
        <div class="text-white-50 mb-3">John Doe • Toyota Corolla • White</div>
        <div class="status-progress bg-white bg-opacity-30 mx-auto" style="width: 200px;">
          <div class="bg-white status-progress-fill" style="width: 65%;"></div>
        </div>
        <small class="text-white-50">ETA 4 min • 1.2 km away</small>
      </div>
      <div class="row g-3 text-center">
        <div class="col">
          <button class="btn btn-light btn-lg px-4 rounded-pill">
            <i class="fas fa-phone me-1"></i>Call
          </button>
        </div>
        <div class="col">
          <button class="btn btn-light btn-lg px-4 rounded-pill">
            <i class="fas fa-comment me-1"></i>Message
          </button>
        </div>
        <div class="col">
          <button class="btn btn-outline-light btn-lg px-4 rounded-pill">
            SOS
          </button>
        </div>
      </div>
    </div>

    <!-- Map -->
    <div class="glass-card rounded-4 p-3 mb-4 shadow-lg">
      <div class="mb-3 d-flex justify-content-between">
        <h6 class="mb-0 text-white fw-bold">Live Tracking</h6>
        <button class="btn btn-sm btn-outline-light">Recenter</button>
      </div>
      <div class="map-placeholder rounded-3" style="height: 300px;">
        <i class="fas fa-map fa-2x text-white-50 mb-2 d-block"></i>
        Your driver is approaching
      </div>
    </div>

    <!-- Trip Details -->
    <div class="glass-card rounded-4 p-4 shadow-lg">
      <h6 class="mb-4 text-white fw-bold">Trip Details</h6>
      <div class="row mb-3">
        <div class="col-3 text-white-50 text-center"><i class="fas fa-flag-checkered fa-lg"></i></div>
        <div class="col-9">
          <div class="fw-bold text-white fs-6 mb-1">Harare CBD → Borrowdale</div>
          <small class="text-white-50">7.3 km • 18 min</small>
        </div>
      </div>
      <div class="row mb-4">
        <div class="col-3 text-white-50 text-center"><i class="fas fa-wallet fa-lg"></i></div>
        <div class="col-9">
          <div class="fw-bold text-white fs-5 mb-1">$22.50</div>
          <small class="text-success fw-semibold">Base + distance fee</small>
        </div>
      </div>
      <div class="d-grid gap-2">
        <button class="btn btn-warning text-dark fw-semibold py-3 rounded-pill">
          <i class="fas fa-share me-2"></i>Share Trip
        </button>
        <button class="btn btn-outline-light py-3 rounded-pill">
          Rate Driver Later
        </button>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed-bottom bg-white shadow-lg rounded-top-4 p-2">
      <div class="d-flex justify-content-around">
        <a href="#" class="btn btn-lg p-3 text-decoration-none">
          <i class="fas fa-home fa-lg mb-1 d-block text-primary"></i>Home
        </a>
        <a href="#" class="btn btn-lg p-3 text-decoration-none active">
          <i class="fas fa-route fa-lg mb-1 d-block text-success"></i>Current
        </a>
        <a href="#" class="btn btn-lg p-3 text-decoration-none">
          <i class="fas fa-history fa-lg mb-1 d-block"></i>History
        </a>
        <a href="#" class="btn btn-lg p-3 text-decoration-none">
          <i class="fas fa-crown fa-lg mb-1 d-block text-warning"></i>Upgrade
        </a>
      </div>
    </nav>
  </div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/realtime.js"></script>
  <script>
    // Customer realtime
    const realtime = new RealtimeEngine('customer');
    
    // Update ETA every 10s
    setInterval(() => {
      const eta = Math.floor(Math.random() * 3) + 2;
      document.querySelector('.text-white-50').innerHTML = `ETA ${eta} min • ${1.5 - eta/10 * 0.3} km away`;
      document.querySelector('.status-progress-fill').style.width = `${70 + Math.random() * 20}%`;
    }, 10000);

    // Realtime trip updates
    socket.on('tripUpdate', data => {
      // Animate status change
      showNoty(`Your trip: ${data.status}`, 'info');
    });
  </script>
</body>
</html>
