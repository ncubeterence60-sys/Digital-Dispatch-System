<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver App - Digital Dispatch</title>
  <!-- PWA -->
  <link rel="manifest" href="manifest-driver.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgZmlsbD0iIzY2N2VlYSIvPgo8L3N2Zz4K">
  <!-- Core -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/uber-style.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); }
    .status-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .map-placeholder { height: 300px; background: linear-gradient(45deg, #e3f2fd, #bbdefb); border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #1976d2; font-weight: 600; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="bg-white shadow-sm sticky-top p-3">
    <div class="d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center">
        <i class="fas fa-car-side fa-2x text-primary me-3"></i>
        <div>
          <div class="fw-bold text-dark" id="driverName">John Doe</div>
          <div class="small text-success" id="driverStatus">Online</div>
        </div>
      </div>
      <div class="text-end">
        <span class="badge bg-success fs-6 status-dot" id="statusBadge"></span>
        <button class="btn btn-outline-danger btn-sm ms-2" onclick="toggleOnline()">Go Offline</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="p-3 pb-5">
    <!-- Current Trip Card -->
    <div class="card shadow-lg border-0 mb-4 rounded-3">
      <div class="card-header bg-gradient text-white py-3">
        <h5 class="mb-0"><i class="fas fa-route me-2"></i>Current Trip</h5>
      </div>
      <div class="card-body">
        <div id="currentTrip" class="text-center py-5">
          <i class="fas fa-check-circle fa-4x text-success mb-3"></i>
          <h4 class="text-success">No active trip</h4>
          <p class="text-muted">Ready for new requests</p>
        </div>
      </div>
    </div>

    <!-- Map Placeholder (Google Maps later) -->
    <div class="map-placeholder mb-4">
      <i class="fas fa-map-marked-alt fa-2x mb-2 d-block"></i>
      Live Location Tracking
    </div>

    <!-- Available Trips -->
    <div class="card shadow border-0 rounded-3">
      <div class="card-header py-3">
        <h6 class="mb-0 fw-bold"><i class="fas fa-clipboard-list me-2"></i>Available Trips <span class="badge bg-primary ms-2" id="tripCount">0</span></h6>
      </div>
      <div class="card-body p-0">
        <div id="availableTrips" class="list-group list-group-flush">
          <!-- Dynamic trips -->
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed-bottom bg-white shadow-lg border-top p-2 d-flex justify-content-around">
    <button class="btn btn-lg p-3 text-primary" onclick="loadTrips()">
      <i class="fas fa-sync fa-lg mb-1 d-block"></i>Home
    </button>
    <button class="btn btn-lg p-3" onclick="showEarnings()">
      <i class="fas fa-wallet fa-lg mb-1 d-block"></i>Earnings
    </button>
    <button class="btn btn-lg p-3" onclick="showProfile()">
      <i class="fas fa-user fa-lg mb-1 d-block"></i>Profile
    </button>
    <button class="btn btn-lg p-3 text-danger" onclick="logout()">
      <i class="fas fa-sign-out-alt fa-lg mb-1 d-block"></i>Logout
    </button>
  </nav>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/realtime.js"></script>
  <script>
    // Driver-specific realtime
    const realtime = new RealtimeEngine('driver');
    
    // Load driver data
    async function loadDriverData() {
      // Mock data - fetch from /driver/profile
      document.getElementById('driverName').textContent = 'John Doe';
      document.getElementById('driverStatus').textContent = 'Online (5km radius)';
    }

    function toggleOnline() {
      const status = document.getElementById('driverStatus').textContent.includes('Online') ? 'Offline' : 'Online';
      realtime.emitStatus(status === 'Online');
      showNoty(`Status: ${status}`, status === 'Online' ? 'success' : 'warning');
    }

    function loadTrips() {
      // Fetch nearby trips from /driver/nearby
      const trips = [
        { id: 1, pickup: 'Harare CBD', dropoff: 'Airport Road', distance: '2.3km', fare: '$15', customer: 'Tinashe' }
      ];
      document.getElementById('tripCount').textContent = trips.length;
      renderTrips(trips);
    }

    function renderTrips(trips) {
      document.getElementById('availableTrips').innerHTML = trips.map(trip => `
        <div class="list-group-item px-4 py-3 border-bottom trip-item hover-card">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="fw-bold">${trip.pickup} → ${trip.dropoff}</div>
              <small class="text-muted">${trip.distance} • Fare: $${trip.fare}</small>
            </div>
            <div class="text-end">
              <div class="fw-semibold text-success">${trip.customer}</div>
              <button class="btn btn-success btn-sm mt-1" onclick="acceptTrip(${trip.id})">
                Accept
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function acceptTrip(id) {
      realtime.requestTrip(id);
      showNoty('Trip accepted!', 'success');
    }

    function showEarnings() {
      showNoty('Today: $45 (3 trips)', 'info');
    }

    function showProfile() {
      showNoty('Profile & ratings', 'info');
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/login.html';
    }

    // Location sharing (every 30s)
    setInterval(() => {
      navigator.geolocation.getCurrentPosition(pos => {
        realtime.sendLocation(pos.coords.latitude, pos.coords.longitude);
      });
    }, 30000);

    // Init
    loadDriverData();
    loadTrips();
    setInterval(loadTrips, 10000);
  </script>
</body>
</html>
