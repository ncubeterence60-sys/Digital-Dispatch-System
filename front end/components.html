<!-- Shared Dispatch Components (Include in all pages) -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/noty@3.2.0-beta/lib/noty.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/noty@3.2.0-beta/lib/noty.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/noty@3.2.0-beta/lib/themes/sunset.css" rel="stylesheet">

<!-- Navbar Component -->
<nav x-data="{ open: false }" class="glass fixed top-0 left-0 right-0 z-50 shadow-2xl px-6 py-4 backdrop-blur-xl">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <a href="/" class="flex items-center space-x-3">
      <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg">
        <i class="fas fa-concierge-bell text-white text-xl"></i>
      </div>
      <div class="hidden md:block">
        <h1 class="text-xl font-bold bg-gradient-to-r from-white to-gray-200 bg-clip-text text-transparent">Digital Dispatch</h1>
        <p class="text-xs text-white/70">Service Platform</p>
      </div>
    </a>
    <div class="flex items-center space-x-2">
      <a href="/dashboard_fixed.html" class="btn bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2 rounded-xl font-semibold shadow-lg hover:shadow-xl transition-all">Dashboard</a>
      <a href="/login.html" class="glass px-6 py-2 rounded-xl text-white font-semibold hover:bg-white/20">Login</a>
      <button @click="open = !open" class="md:hidden p-2 rounded-xl glass text-white">
        <i class="fas fa-bars text-xl"></i>
      </button>
    </div>
  </div>
</nav>

<!-- Role Selector Modal (PWA-like) -->
<div x-data="{ role: 'dispatcher', show: false }" x-show="show" x-transition class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" @click.away="show = false">
  <div class="glass p-8 rounded-3xl max-w-md w-full max-h-[90vh] overflow-y-auto" @click.stop>
    <h2 class="text-2xl font-bold text-white mb-6">Select Role</h2>
    <div class="space-y-4">
      <button onclick="setRole('dispatcher')" class="w-full glass p-6 rounded-2xl text-left hover:bg-white/20 transition-all group">
        <div class="flex items-center space-x-4">
          <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center group-hover:scale-110">
            <i class="fas fa-tachometer-alt text-white text-xl"></i>
          </div>
          <div>
            <h3 class="font-bold text-white text-lg">Dispatcher</h3>
            <p class="text-white/80">Manage trips, providers, real-time dispatch</p>
          </div>
        </div>
      </button>
      <button onclick="setRole('admin')" class="w-full glass p-6 rounded-2xl text-left hover:bg-white/20 transition-all group">
        <div class="flex items-center space-x-4">
          <div class="w-14 h-14 bg-gradient-to-br from-purple-500 to-violet-600 rounded-xl flex items-center justify-center group-hover:scale-110">
            <i class="fas fa-chart-line text-white text-xl"></i>
          </div>
          <div>
            <h3 class="font-bold text-white text-lg">Admin</h3>
            <p class="text-white/80">Analytics, reports, system management</p>
          </div>
        </div>
      </button>
      <button onclick="setRole('driver')" class="w-full glass p-6 rounded-2xl text-left hover:bg-white/20 transition-all group">
        <div class="flex items-center space-x-4">
          <div class="w-14 h-14 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-xl flex items-center justify-center group-hover:scale-110">
            <i class="fas fa-car-side text-white text-xl"></i>
          </div>
          <div>
            <h3 class="font-bold text-white text-lg">Driver</h3>
            <p class="text-white/80">Accept trips, navigation, earnings</p>
          </div>
        </div>
      </button>
    </div>
  </div>
</div>

<script>
function setRole(role) {
  localStorage.setItem('dispatchRole', role);
  if (role === 'dispatcher') window.location.href = '/dashboard_fixed.html';
  if (role === 'admin') window.location.href = '/admin-dashboard.html';
  if (role === 'driver') window.location.href = '/driver-dashboard.html';
}
if (!localStorage.getItem('dispatchRole')) {
  // Show role selector on first visit
  setTimeout(() => document.querySelector('[x-data\\=\\{ role: \\\'dispatcher\\\'\\, show: false \\}]').__x.$data.show = true, 500);
}
</script>

<!-- Notification Toast System -->
<div id="toast-container"></div>

<script>
function notify(type, message, timeout = 4000) {
  new Noty({
    type,
    text: `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-triangle' : 'info-circle'} me-2"></i>${message}`,
    timeout,
    progressBar: true,
    layout: 'topRight'
  }).show();
}
window.notify = notify;
</script>

<!-- Loading Overlay -->
<div id="loading-overlay" class="fixed inset-0 bg-gradient-to-br from-black/60 via-indigo-900/40 to-black/60 backdrop-blur-sm z-[999] hidden flex items-center justify-center">
  <div class="text-center text-white space-y-4">
    <div class="w-16 h-16 border-4 border-white/20 border-t-white rounded-full animate-spin mx-auto"></div>
    <div>
      <div class="text-xl font-semibold mb-1">Loading Dispatch...</div>
      <div class="text-sm opacity-75">Real-time data syncing</div>
    </div>
  </div>
</div>

<script>
function showLoading() { document.getElementById('loading-overlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }
window.loading = { show: showLoading, hide: hideLoading };
</script>
