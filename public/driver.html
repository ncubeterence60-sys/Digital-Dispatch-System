<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver App - Digital Dispatch</title>
  <link rel="manifest" href="manifest-driver.json">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/uber-style.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); }
    .status-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .map-placeholder { height: 300px; background: linear-gradient(45deg, #e3f2fd, #bbdefb); }
    .complete-btn { background: linear-gradient(135deg, #10b981, #059669); }
  </style>
</head>
<body>
  <header class="bg-white shadow-sm sticky-top p-3">
    <div class="d-flex align-items-center justify-content-between">
      <div>
        <i class="fas fa-car-side fa-2x text-primary me-3"></i>
        <div class="fw-bold text-dark" id="driverStatus">Online</div>
      </div>
      <div>
        <span class="badge bg-success fs-6 status-dot me-2"></span>
        <button class="btn btn-sm btn-outline-danger" onclick="toggleStatus()">Go Offline</button>
      </div>
    </div>
  </header>

  <main class="p-3 pb-5">
    <!-- Current Trip -->
    <div class="card shadow-lg border-0 mb-4 rounded-3" id="currentTripCard">
      <div class="card-header bg-success text-white py-3">
        <h5 class="mb-0"><i class="fas fa-route me-2"></i>Current Trip</h5>
      </div>
      <div class="card-body text-center py-5">
        <i class="fas fa-check-circle fa-4x text-success mb-3"></i>
        <h4 class="text-success">No active trip</h4>
      </div>
    </div>

    <!-- Available Trips -->
    <div class="card shadow border-0 rounded-3">
      <div class="card-header py-3">
        <h6 class="mb-0 fw-bold"><i class="fas fa-list me-2"></i>Available Trips <span class="badge bg-primary ms-2" id="tripCount">0</span></h6>
      </div>
      <div class="card-body p-0">
        <div id="tripsList" class="list-group list-group-flush">
          <!-- Loaded dynamically -->
        </div>
      </div>
    </div>

    <!-- Earnings + Paynow/Ecocash -->
    <div class="card shadow border-0 rounded-3 mt-4">
      <div class="card-header py-3">
        <h6 class="mb-0"><i class="fas fa-wallet me-2"></i>Earnings & Payouts</h6>
      </div>
      <div class="card-body">
        <div class="row text-center mb-4">
          <div class="col">
            <div class="fs-5 fw-bold text-success" id="todayEarnings">$0.00</div>
            <small>Today</small>
          </div>
          <div class="col">
            <div class="fs-5 fw-bold text-primary" id="totalEarnings">$0.00</div>
            <small>Total</small>
          </div>
        </div>
        <div class="row g-2">
          <div class="col-6">
            <button class="btn btn-success w-100 py-2" onclick="openPaynow()">
              <i class="fas fa-mobile-alt me-1"></i>Paynow Payout
            </button>
          </div>
          <div class="col-6">
            <button class="btn btn-warning text-dark w-100 py-2" onclick="openEcocash()">
              <i class="fas fa-wallet me-1"></i>Ecocash
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/realtime.js"></script>
  <script>
    const realtime = new RealtimeEngine('driver');
    const DRIVER_ID = 1; // Mock

    async function loadTrips() {
      try {
        const res = await fetch(`/drivers/${DRIVER_ID}/trips`);
        const trips = await res.json();
        renderTrips(trips);
        document.getElementById('tripCount').textContent = trips.length;
      } catch (e) {
        console.error('Load trips error:', e);
      }
    }

    function renderTrips(trips) {
      document.getElementById('tripsList').innerHTML = trips.map(trip => `
        <div class="list-group-item p-4 border-bottom trip-card">
          <div class="d-flex justify-content-between">
            <div>
              <div class="fw-bold">${trip.pickup_location} → ${trip.dropoff_location}</div>
              <small>${trip.fare ? '$' + trip.fare : 'N/A'}</small>
            </div>
            <button class="btn btn-success px-4" onclick="acceptTrip(${trip.trip_id})">
              Accept
            </button>
          </div>
        </div>
      `).join('');
    }

    async function acceptTrip(tripId) {
      try {
        const res = await fetch(`/drivers/${DRIVER_ID}/trips/${tripId}/accept`, {method: 'POST'});
        const data = await res.json();
        showNoty('Trip accepted!');
        loadTrips();
      } catch (e) {
        showNoty('Error accepting trip', 'error');
      }
    }

    async function loadEarnings() {
      const res = await fetch(`/drivers/${DRIVER_ID}/earnings`);
      const data = await res.json();
      document.getElementById('todayEarnings').textContent = `$${data.today_earnings}`;
      document.getElementById('totalEarnings').textContent = `$${data.total_earnings}`;
    }

    function toggleStatus() {
      const isOnline = document.getElementById('driverStatus').textContent.includes('Online');
      const status = isOnline ? 'offline' : 'online';
      realtime.emitStatus(status);
      document.getElementById('driverStatus').textContent = isOnline ? 'Offline' : 'Online';
      showNoty(`Status: ${status === 'online' ? 'Online' : 'Offline'}`, status === 'online' ? 'success' : 'warning');
    }

    // Mock current trip complete
    async function completeCurrentTrip() {
      const fare = prompt('Enter actual fare:');
      if (fare && currentTripId) {
        await fetch(`/drivers/${DRIVER_ID}/trips/${currentTripId}/complete`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({actual_fare: fare})
        });
        showNoty('Trip completed!');
        loadTrips();
        loadEarnings();
      }
    }

    // Init
    loadTrips();
    loadEarnings();
    setInterval(() => {
      loadTrips();
      loadEarnings();
    }, 10000);
  </script>
</body>
</html>
