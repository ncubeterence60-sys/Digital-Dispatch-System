<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nasho Technologies - Service Marketplace Dashboard</title>
  
  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/noty@3.2.0-beta/lib/noty.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/noty@3.2.0-beta/lib/themes/bootstrap-v4.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .sidebar { max-height: calc(100vh - 80px); overflow-y: auto; }
    .stats-card { height: 120px; }
    .provider-item.highlighted { background-color: #fff3cd; border-left: 3px solid #ffc107; }
    
    .loading-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.9); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 10;
    }
    
    .status-badge {
      display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.25rem 0.75rem; 
      border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    }
    .status-badge.available { background: rgba(72, 187, 120, 0.15); color: #276749; }
    .status-badge.busy { background: rgba(245, 101, 101, 0.15); color: #c53030; }
    .status-badge.pending { background: rgba(246, 173, 85, 0.15); color: #dd6b20; }
    
    .service-icon { font-size: 1.5rem; }
    .quick-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .quick-action-btn { width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer; }
    .quick-action-btn:hover { transform: scale(1.1); }
    .quick-action-btn.whatsapp { background: rgba(37, 211, 102, 0.2); color: #25d366; }
    .quick-action-btn.sms { background: rgba(0, 122, 255, 0.2); color: #007AFF; }
    
    @media (max-width: 768px) { .stats-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <i class="fas fa-concierge-bell me-2"></i>
        <span>Nasho Technologies</span> <small class="text-white-50 ms-2">Service Marketplace</small>
      </a>
      <div class="navbar-nav ms-auto">
        <div class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-white" href="#" data-bs-toggle="dropdown">
            <i class="fas fa-bell me-1"></i> Notifications <span class="badge bg-danger" id="notifBadge" style="display:none">0</span>
          </a>
          <div class="dropdown-menu dropdown-menu-end" id="notifDropdown">
            <h6 class="dropdown-header">Recent Notifications</h6>
            <div id="notifList">No new notifications</div>
          </div>
        </div>
        <button class="btn btn-outline-light ms-2" onclick="refreshData()"><i class="fas fa-sync"></i></button>
        <button class="btn btn-outline-light ms-2" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid py-4">
    <!-- Stats Grid - NO MAP -->
    <div class="row mb-4 stats-grid">
      <div class="col-md-3 mb-3">
        <div class="card stats-card bg-primary text-white border-0 shadow-sm">
          <div class="card-body text-center">
            <i class="fas fa-users fa-2x mb-2 opacity-75"></i>
            <h3 id="totalProviders" class="mb-0">0</h3>
            <small>Service Providers</small>
          </div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card stats-card bg-success text-white border-0 shadow-sm">
          <div class="card-body text-center">
            <i class="fas fa-clipboard-list fa-2x mb-2 opacity-75"></i>
            <h3 id="totalRequests" class="mb-0">0</h3>
            <small>Active Requests</small>
          </div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card stats-card bg-warning text-dark border-0 shadow-sm">
          <div class="card-body text-center">
            <i class="fas fa-check-circle fa-2x mb-2 opacity-75"></i>
            <h3 id="completed" class="mb-0">0</h3>
            <small>Completed Today</small>
          </div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card stats-card bg-info text-white border-0 shadow-sm">
          <div class="card-body text-center">
            <i class="fas fa-clock fa-2x mb-2 opacity-75"></i>
            <h3 id="pending" class="mb-0">0</h3>
            <small>Pending</small>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-6 mb-4">
        <div class="card h-100">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="fas fa-clipboard-list text-primary me-2"></i>Recent Service Requests</h5>
            <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addRequestModal">
              <i class="fas fa-plus"></i>
            </button>
          </div>
          <div class="card-body position-relative p-0" id="requestsContainer" style="height: 400px; overflow-y: auto;">
            <div class="loading-overlay d-flex align-items-center justify-content-center" id="requestsLoading">
              <div class="spinner-border text-primary" role="status"></div>
            </div>
            <div id="requestsList">Loading requests...</div>
          </div>
        </div>
      </div>
      
      <div class="col-lg-6 mb-4">
        <div class="card h-100">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="fas fa-users text-success me-2"></i>Available Providers</h5>
            <button class="btn btn-sm btn-success" data-bs-toggle="modal" data-bs-target="#addProviderModal">
              <i class="fas fa-plus"></i>
            </button>
          </div>
          <div class="card-body position-relative p-0" id="providersContainer" style="height: 400px; overflow-y: auto;">
            <div class="loading-overlay d-flex align-items-center justify-content-center" id="providersLoading">
              <div class="spinner-border text-success" role="status"></div>
            </div>
            <div id="providersList">Loading providers...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Request Modal -->
  <div class="modal fade" id="addRequestModal">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fas fa-plus-circle me-2"></i>New Service Request</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addRequestForm">
            <div class="row">
              <div class="col-md-6">
                <label class="form-label">Service Type</label>
                <select class="form-select" id="serviceTypeSelect" required>
                  <option value="">Select Type</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Customer</label>
                <input type="text" class="form-control" id="customerName" placeholder="Customer name" required>
              </div>
            </div>
            <div class="row mt-3">
              <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="tel" class="form-control" id="customerPhone" placeholder="+263..." required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Location</label>
                <input type="text" class="form-control" id="requestLocation" placeholder="Service location">
              </div>
            </div>
            <div class="mt-3">
              <label class="form-label">Details</label>
              <textarea class="form-control" id="requestDetails" rows="3" placeholder="Service details..."></textarea>
            </div>
            <div class="mt-4 d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Create Request</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Provider Modal -->
  <div class="modal fade" id="addProviderModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fas fa-user-plus me-2"></i>New Provider</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addProviderForm">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" id="providerName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" id="providerPhone" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Service Type</label>
              <select class="form-select" id="providerServiceType" required>
                <option value="">Select Type</option>
              </select>
            </div>
            <div class="mt-3 d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-success">Add Provider</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/noty@3.2.0-beta/lib/noty.min.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  
  <script>
    // Nasho Technologies Service Marketplace Dashboard - NO MAP
    let serviceTypes = [], socket;
    
    function showNotification(msg, type = 'info') {
      new Noty({
        text: msg,
        type,
        timeout: 4000,
        progressBar: false
      }).show();
    }
    
    function updateStats(providers, requests) {
      document.getElementById('totalProviders').textContent = providers.length;
      document.getElementById('totalRequests').textContent = requests.length;
      document.getElementById('pending').textContent = requests.filter(r => r.status === 'Pending').length;
      document.getElementById('completed').textContent = requests.filter(r => r.status === 'Completed').length;
    }
    
    function loadServiceTypes() {
      fetch('/services').then(r => r.json()).then(data => {
        serviceTypes = data;
        document.getElementById('serviceTypeSelect').innerHTML = data.map(t => `<option value="${t.service_type_id}">${t.icon} ${t.name}</option>`).join('');
        document.getElementById('providerServiceType').innerHTML = data.map(t => `<option value="${t.service_type_id}">${t.icon} ${t.name}</option>`).join('');
      }).catch(() => serviceTypes = [{service_type_id:1, name:'Transport', icon:'🚗'}]);
    }
    
    function loadRequests() {
      fetch('/requests').then(r => r.json()).then(requests => {
        updateStats([], requests);
        const container = document.getElementById('requestsList');
        container.innerHTML = requests.map(r => `
          <div class="p-3 border-bottom">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h6 class="mb-1">${r.user_name || 'Customer'} <small class="text-muted">#${r.request_id}</small></h6>
                <small class="text-muted">${r.user_phone}</small>
                <span class="badge ms-2 status-badge ${r.status.toLowerCase()}">${r.status}</span>
              </div>
              <div class="btn-group btn-group-sm" role="group">
                <button class="btn btn-outline-success quick-action-btn whatsapp" onclick="sendWhatsApp('${r.user_phone}')" title="WhatsApp">
                  <i class="fab fa-whatsapp"></i>
                </button>
                <button class="btn btn-outline-primary quick-action-btn sms" onclick="sendSMS('${r.user_phone}')" title="SMS">
                  <i class="fas fa-sms"></i>
                </button>
              </div>
            </div>
          </div>
        `).join('') || '<div class="text-center p-4 text-muted"><i class="fas fa-inbox fa-3x mb-3 opacity-50"></i>No requests</div>';
        
        document.getElementById('requestsLoading').style.display = 'none';
      }).catch(showNotification('Failed to load requests', 'error'));
    }
    
    function loadProviders() {
      fetch('/providers').then(r => r.json()).then(providers => {
        updateStats(providers, []);
        const container = document.getElementById('providersList');
        container.innerHTML = providers.map(p => `
          <div class="p-3 border-bottom provider-item ${p.status.toLowerCase()}">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h6 class="mb-1">${p.name}</h6>
                <small class="text-muted">${p.phone}</small>
                <span class="badge ms-2 status-badge ${p.status.toLowerCase()}">${p.status}</span>
              </div>
              <div class="btn-group btn-group-sm">
                <select class="form-select form-select-sm" onchange="updateStatus(${p.provider_id}, this.value)" style="width: 100px;">
                  <option value="Available" ${p.status === 'Available' ? 'selected' : ''}>Available</option>
                  <option value="Busy" ${p.status === 'Busy' ? 'selected' : ''}>Busy</option>
                  <option value="Offline" ${p.status === 'Offline' ? 'selected' : ''}>Offline</option>
                </select>
              </div>
            </div>
          </div>
        `).join('') || '<div class="text-center p-4 text-muted"><i class="fas fa-users fa-3x mb-3 opacity-50"></i>No providers</div>';
        
        document.getElementById('providersLoading').style.display = 'none';
      }).catch(showNotification('Failed to load providers', 'error'));
    }
    
    function refreshData() {
      document.getElementById('requestsLoading').style.display = 'flex';
      document.getElementById('providersLoading').style.display = 'flex';
      loadRequests();
      loadProviders();
    }
    
    function sendWhatsApp(phone) {
      fetch('/communicate/whatsapp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({to_phone: phone, message: 'Hello from Nasho Technologies Service Marketplace! Your request is being processed.'})
      }).then(() => showNotification('WhatsApp sent!')).catch(console.error);
    }
    
    function sendSMS(phone) {
      fetch('/communicate/sms', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({to_phone: phone, message: 'Nasho Technologies: Your service request has been received.'})
      }).then(() => showNotification('SMS sent!')).catch(console.error);
    }
    
    function updateStatus(id, status) {
      // Simple mock update
      showNotification(`Provider ${id} set to ${status}`);
      refreshData();
    }
    
    function logout() {
      if (confirm('Logout?')) window.location.href = '/';
    }
    
    // Init
    loadServiceTypes();
    refreshData();
    setInterval(refreshData, 15000);
    
    // Socket.io
    socket = io();
    socket.on('tripUpdate', refreshData);
    
    // Forms
    document.getElementById('addRequestForm').onsubmit = e => {
      e.preventDefault();
      const data = {
        service_type_id: document.getElementById('serviceTypeSelect').value,
        user_name: document.getElementById('customerName').value,
        user_phone: document.getElementById('customerPhone').value,
        pickup_location: document.getElementById('requestLocation').value,
        description: document.getElementById('requestDetails').value
      };
      fetch('/requests', {method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)})
        .then(() => {
          bootstrap.Modal.getInstance(document.getElementById('addRequestModal')).hide();
          showNotification('Request created!', 'success');
          refreshData();
        }).catch(console.error);
    };
    
    document.getElementById('addProviderForm').onsubmit = e => {
      e.preventDefault();
      showNotification('Provider added!', 'success');
      bootstrap.Modal.getInstance(document.getElementById('addProviderModal')).hide();
      refreshData();
    };
  </script>
</body>
</html>
