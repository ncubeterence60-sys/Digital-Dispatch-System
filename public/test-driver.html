<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Test App - Digital Dispatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; }
    #map { height: 500px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .control-group { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 1.5rem; margin-bottom: 1.5rem; }
    .btn-location { border-radius: 10px; font-weight: 600; }
    .status-indicator { height: 12px; width: 12px; border-radius: 50%; display: inline-block; }
    .coords-display { font-family: 'Courier New', monospace; font-size: 0.9rem; background: #f1f5f9; padding: 0.5rem; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4">
      <i class="fas fa-car-side me-2 text-success"></i>
      Driver Test Tool
    </h1>
    <p class="lead text-muted mb-5">Simulate driver location updates for customer.html map testing. Uses real WebSocket/DB.</p>

    <!-- Status -->
    <div class="control-group">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5><i class="fas fa-signal me-2 text-primary"></i>Connection Status</h5>
        <div>
          <span class="status-indicator bg-gray-300 me-2" id="wsStatus"></span>
          <small id="wsInfo">Disconnected</small>
        </div>
      </div>
      <div class="row">
        <div class="col-md-3">
          <label class="form-label fw-semibold">Driver ID</label>
          <input type="number" class="form-control" id="driverId" value="1" min="1">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Status</label>
          <select class="form-select" id="driverStatus">
            <option value="online">Online</option>
            <option value="offline">Offline</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Heading</label>
          <input type="number" class="form-control" id="heading" value="0" min="0" max="360">
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-success w-100" onclick="updateDriverStatus()">
            <i class="fas fa-broadcast-tower me-2"></i>Update Status
          </button>
        </div>
      </div>
    </div>

    <!-- Location Controls -->
    <div class="control-group">
      <div class="d-flex justify-content-between mb-3">
        <h5><i class="fas fa-map-marker-alt me-2 text-info"></i>Location Controls</h5>
        <button class="btn btn-outline-primary btn-sm" onclick="getCurrentLocation()">
          <i class="fas fa-location-arrow"></i> GPS Now
        </button>
      </div>
      <div class="row">
        <div class="col-md-3">
          <label class="form-label fw-semibold">Latitude</label>
          <input type="number" class="form-control" id="lat" step="any" value="-17.8179">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Longitude</label>
          <input type="number" class="form-control" id="lng" step="any" value="31.0446">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Current Coords</label>
          <div class="coords-display p-2" id="currentCoords">No location</div>
        </div>
      </div>
      <div class="mt-3">
        <button class="btn btn-primary me-2" onclick="sendLocation()">
          <i class="fas fa-paper-plane"></i> Send Location Update
        </button>
        <button class="btn btn-info" onclick="randomLocation()">
          <i class="fas fa-dice"></i> Random Harare
        </button>
        <button class="btn btn-warning" onclick="driveRoute()">
          <i class="fas fa-route"></i> Drive Test Route
        </button>
      </div>
    </div>

    <!-- Live Map -->
    <div class="control-group">
      <h5><i class="fas fa-map me-2 text-success"></i>Live Map (Preview)</h5>
      <div id="map"></div>
    </div>

    <!-- Logs -->
    <div class="control-group">
      <h5><i class="fas fa-list me-2 text-muted"></i>Event Logs</h5>
      <div id="logs" style="height: 200px; overflow-y: auto; background: #f8fafc; border-radius: 8px; padding: 1rem; font-size: 0.875rem; border: 1px solid #e2e8f0;"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let socket, map, marker;
    const API_BASE = location.host.includes('localhost') ? 'http://localhost:3000/api' : '/api';
    let isDriving = false;

    // Init
    document.addEventListener('DOMContentLoaded', init);

    function init() {
      initMap();
      initSocket();
      updateStatusIndicator();
      logEvent('Test app ready. Update location to see customer map react!');
    }

    function initSocket() {
      socket = io(API_BASE.replace('/api', '')); // Socket base
      socket.on('connect', () => {
        document.getElementById('wsStatus').className = 'status-indicator bg-success';
        document.getElementById('wsInfo').textContent = `Connected (${socket.id.slice(0,8)}...)`;
        logEvent('✅ WebSocket connected');
      });
      socket.on('disconnect', () => {
        document.getElementById('wsStatus').className = 'status-indicator bg-gray-300';
        document.getElementById('wsInfo').textContent = 'Disconnected';
        logEvent('❌ WebSocket disconnected');
      });
      socket.on('driverLocation', (data) => logEvent(`📍 Received location echo: Driver ${data.driverId}`));
    }

    function initMap() {
      map = L.map('map').setView([-17.8179, 31.0446], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap | Digital Dispatch Test'
      }).addTo(map);
      marker = L.marker([-17.8179, 31.0446], {
        icon: L.divIcon({html: '<i class="fas fa-car text-success fa-lg"></i>', className: 'custom-div-icon'})
      }).addTo(map);
    }

    async function updateDriverStatus() {
      const driverId = document.getElementById('driverId').value;
      const status = document.getElementById('driverStatus').value;
      const heading = document.getElementById('heading').value;
      
      try {
        const res = await fetch(`${API_BASE}/drivers/${driverId}/status`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ status, lat: parseFloat(document.getElementById('lat').value), 
                                lng: parseFloat(document.getElementById('lng').value), heading: parseFloat(heading) })
        });
        const data = await res.json();
        logEvent(`✅ Status updated: ${status} (Driver ${driverId}) ${data.success ? '✓' : '✗'}`);
        if (data.success) updateMapMarker();
      } catch (e) {
        logEvent(`❌ Status update failed: ${e.message}`);
      }
    }

    async function sendLocation() {
      const driverId = document.getElementById('driverId').value;
      const lat = parseFloat(document.getElementById('lat').value);
      const lng = parseFloat(document.getElementById('lng').value);
      
      await updateDriverStatus(); // Uses current status
      logEvent(`📤 Sent location: ${lat.toFixed(4)}, ${lng.toFixed(4)}`);
      updateCurrentCoords(lat, lng);
    }

    function updateMapMarker() {
      const lat = parseFloat(document.getElementById('lat').value);
      const lng = parseFloat(document.getElementById('lng').value);
      const heading = parseFloat(document.getElementById('heading').value);
      
      marker.setLatLng([lat, lng]);
      marker.getIcon().options.iconAnchor = [12, 12]; // Rotate effect mock
      marker.setIcon(L.divIcon({
        html: `<i class="fas fa-car text-success fa-lg" style="transform: rotate(${heading}deg)"></i>`,
        className: 'custom-div-icon',
        iconSize: [24, 24]
      }));
      map.panTo([lat, lng]);
    }

    function getCurrentLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          document.getElementById('lat').value = pos.coords.latitude;
          document.getElementById('lng').value = pos.coords.longitude;
          updateMapMarker();
          updateCurrentCoords(pos.coords.latitude, pos.coords.longitude);
          logEvent('📱 GPS location acquired');
        }, () => logEvent('❌ GPS denied'));
      }
    }

    function randomLocation() {
      const harareLocs = [
        [-17.8179, 31.0446], // CBD
        [-17.9297, 31.1004], // Airport
        [-17.788, 31.071], // Borrowdale
        [-17.835, 31.078], // Eastlea
        [-17.802, 31.035] // Avondale
      ];
      const randomLoc = harareLocs[Math.floor(Math.random() * harareLocs.length)];
      document.getElementById('lat').value = randomLoc[0];
      document.getElementById('lng').value = randomLoc[1];
      updateMapMarker();
      logEvent(`🎲 Random Harare location: ${randomLoc[0].toFixed(4)}, ${randomLoc[1].toFixed(4)}`);
    }

    function driveRoute() {
      if (isDriving) {
        isDriving = false;
        logEvent('🛑 Test drive stopped');
        return;
      }
      isDriving = true;
      logEvent('🚗 Starting test drive route (Harare CBD → Airport)');
      
      const route = [
        [-17.8179, 31.0446],
        [-17.82, 31.05],
        [-17.85, 31.07],
        [-17.88, 31.09],
        [-17.90, 31.10],
        [-17.9297, 31.1004]
      ];
      let i = 0;
      const driveInterval = setInterval(() => {
        if (i >= route.length) {
          clearInterval(driveInterval);
          logEvent('✅ Test drive completed');
          isDriving = false;
          return;
        }
        const [lat, lng] = route[i];
        document.getElementById('lat').value = lat;
        document.getElementById('lng').value = lng;
        document.getElementById('heading').value = (i * 30) % 360;
        updateDriverStatus();
        i++;
      }, 3000);
    }

    function updateCurrentCoords(lat, lng) {
      document.getElementById('currentCoords').textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }

    function updateStatusIndicator() {
      // Auto-update every 5s
      setInterval(async () => {
        try {
          const res = await fetch(`${API_BASE}/drivers/1`); // Test endpoint
          if (res.ok) document.getElementById('wsStatus').className = 'status-indicator bg-success';
        } catch (e) {
          document.getElementById('wsStatus').className = 'status-indicator bg-yellow-400';
        }
      }, 5000);
    }

    function logEvent(msg) {
      const logs = document.getElementById('logs');
      const time = new Date().toLocaleTimeString('en-ZW', {timeZone: 'Africa/Harare'});
      logs.innerHTML = `[${time}] ${msg}<br>` + logs.innerHTML;
      logs.scrollTop = 0;
      console.log(msg);
    }
  </script>
</body>
</html>
